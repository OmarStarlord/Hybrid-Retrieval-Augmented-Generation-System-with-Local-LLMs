<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LlamaRAG</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      display: flex;
      height: 100vh;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 260px;
      background: #1a1d27;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      border-right: 1px solid #2a2d3a;
      flex-shrink: 0;
    }

    #sidebar h1 { font-size: 1.3rem; color: #fff; }
    #sidebar h2 { font-size: 0.85rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }

    #sidebar p, #sidebar li {
      font-size: 0.85rem;
      color: #aaa;
      line-height: 1.6;
    }

    #sidebar ul { padding-left: 16px; }

    .example-btn {
      background: #23263a;
      border: 1px solid #2e3150;
      color: #ccc;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: left;
      width: 100%;
      transition: background 0.2s;
    }
    .example-btn:hover { background: #2e3150; color: #fff; }

    /* ── Main ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .message { display: flex; flex-direction: column; gap: 6px; }

    .message.user .bubble {
      align-self: flex-end;
      background: #2e3150;
      color: #fff;
      padding: 10px 16px;
      border-radius: 16px 16px 4px 16px;
      max-width: 60%;
    }

    .message.assistant .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .panel {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 10px;
      padding: 16px;
    }

    .panel h3 {
      font-size: 0.9rem;
      margin-bottom: 10px;
      color: #a78bfa;
    }

    .panel p { font-size: 0.9rem; line-height: 1.6; color: #ccc; }

    details { margin-top: 12px; }
    summary {
      font-size: 0.8rem;
      color: #888;
      cursor: pointer;
      user-select: none;
    }
    summary:hover { color: #ccc; }

    pre {
      margin-top: 8px;
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 6px;
      padding: 10px;
      font-size: 0.78rem;
      color: #7dd3fc;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    /* ── Input bar ── */
    #input-bar {
      padding: 16px 24px;
      border-top: 1px solid #2a2d3a;
      display: flex;
      gap: 10px;
      background: #0f1117;
    }

    #question-input {
      flex: 1;
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 8px;
      color: #fff;
      padding: 12px 16px;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }
    #question-input:focus { border-color: #a78bfa; }

    #ask-btn {
      background: #a78bfa;
      color: #0f1117;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    #ask-btn:hover { background: #c4b5fd; }
    #ask-btn:disabled { background: #444; cursor: not-allowed; }

    .thinking {
      color: #888;
      font-size: 0.85rem;
      font-style: italic;
      padding: 8px 0;
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <div>
    <h1>LlamaRAG</h1>
  </div>
  <div>
    <h2>About</h2>
    <p>Two RAG approaches compared side by side:</p>
    <ul>
      <li><strong>Chroma</strong> — semantic vector search</li>
      <li><strong>Neo4j</strong> — structured graph queries</li>
    </ul>
  </div>
  <div>
    <h2>Examples</h2>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <button class="example-btn" onclick="useExample(this)">Which movies have Action as a genre?</button>
      <button class="example-btn" onclick="useExample(this)">What genres does Sam Raimi work in?</button>
      <button class="example-btn" onclick="useExample(this)">Recommend me something feel-good and lighthearted</button>
      <button class="example-btn" onclick="useExample(this)">Find me movies with a similar vibe to Malena</button>
    </div>
  </div>
</div>

<!-- Main -->
<div id="main">
  <div id="chat-history"></div>

  <div id="input-bar">
    <input
      id="question-input"
      type="text"
      placeholder="Ask a question gng..."
      onkeydown="if(event.key==='Enter') ask()"
    />
    <button id="ask-btn" onclick="ask()">Ask</button>
  </div>
</div>

<script>
  const history  = document.getElementById("chat-history");
  const input    = document.getElementById("question-input");
  const btn      = document.getElementById("ask-btn");

  function useExample(el) {
    input.value = el.textContent;
    input.focus();
  }

  function appendUser(question) {
    const div = document.createElement("div");
    div.className = "message user";
    div.innerHTML = `<div class="bubble">${escHtml(question)}</div>`;
    history.appendChild(div);
    history.scrollTop = history.scrollHeight;
  }

  function appendThinking() {
    const div = document.createElement("div");
    div.className = "message assistant";
    div.id = "thinking";
    div.innerHTML = `<p class="thinking">Thinking...</p>`;
    history.appendChild(div);
    history.scrollTop = history.scrollHeight;
    return div;
  }

  function replaceWithAnswer(placeholder, data) {
    placeholder.innerHTML = `
      <div class="columns">
        <div class="panel">
          <h3>📚 Vector (Chroma)</h3>
          <p>${escHtml(data.chroma_answer)}</p>
        </div>
        <div class="panel">
          <h3>🕸️ Graph (Neo4j)</h3>
          <p>${escHtml(data.neo4j_answer)}</p>
          <details>
            <summary>View Cypher Query</summary>
            <pre>${escHtml(data.cypher)}</pre>
          </details>
        </div>
      </div>`;
    history.scrollTop = history.scrollHeight;
  }

  function escHtml(str) {
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  async function ask() {
    const question = input.value.trim();
    if (!question) return;

    input.value = "";
    btn.disabled = true;

    appendUser(question);
    const placeholder = appendThinking();

    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
      });
      const data = await res.json();
      replaceWithAnswer(placeholder, data);
    } catch (err) {
      placeholder.innerHTML = `<p style="color:#f87171">Error: ${err.message}</p>`;
    } finally {
      btn.disabled = false;
      input.focus();
    }
  }
</script>
</body>
</html>
